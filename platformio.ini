[env:crowpanel_128]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

; BLE + LVGL + LovyanGFX together exceed the default app partition, so use the
; large single-app layout (no OTA).
board_build.partitions = huge_app.csv

lib_deps =
  lvgl/lvgl@^8.3.11
  lovyan03/LovyanGFX@^1.1.16
  h2zero/NimBLE-Arduino@^2.1.0

build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -D DISPLAY_RGB_ORDER=0
  -D DISPLAY_FLUSH_SWAP565=1
  -D DISPLAY_VARIANT_NAME=\"crowpanel-1.28\"
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_MAX_DEVICE_INSTANCES=8

; Default build target: Montserrat UI font. The previous display-calibration
; variants (rgb/swap permutations) were collapsed into the defaults above once
; the correct GC9A01 color order was confirmed.

; Same firmware, but built with the embedded Roboto UI font instead of
; Montserrat. The unused family is gated off in lv_conf.h so each build only
; pays flash for the font it uses.
[env:crowpanel_128_roboto]
extends = env:crowpanel_128
build_flags =
  ${env:crowpanel_128.build_flags}
  -D UI_FONT_ROBOTO

[env:native]
platform = native
test_build_src = true
build_src_filter =
  +<shark_protocol.cpp>
  +<shark_state.cpp>
  +<core/driver_catalog.cpp>
  +<core/device_registry.cpp>
  +<core/config_store.cpp>
  +<core/device_manager.cpp>
build_flags =
  -std=gnu++17
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_MAX_DEVICE_INSTANCES=8

; Desktop LVGL harness: renders the real UI into 240x240 PNG screenshots
; without flashing hardware. Run from the repo root:
;   PLATFORMIO_CORE_DIR="$PWD/.platformio-core" ./.venv/bin/platformio run -e ui_sim
;   .pio/build/ui_sim/program
[env:ui_sim]
platform = native
lib_deps =
  lvgl/lvgl@^8.3.11
build_src_filter =
  +<ui.cpp>
  +<shark_ui.cpp>
  +<shark_state.cpp>
  +<shark_protocol.cpp>
  +<core/driver_catalog.cpp>
  +<core/device_registry.cpp>
  +<core/config_store.cpp>
  +<core/device_manager.cpp>
  +<../sim/main.cpp>
  +<../sim/millis.cpp>
  +<../sim/device_runtime_sim.cpp>
build_flags =
  -std=gnu++17
  -D UI_SIMULATOR=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_COLOR_16_SWAP=0
  -D LV_MEM_SIZE="(128U * 1024U)"
  -I include
  -I sim
  -I src
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_MAX_DEVICE_INSTANCES=8
