[env:crowpanel_128]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-211240
monitor_dtr = 0
monitor_rts = 0
upload_port = /dev/cu.usbserial-211240
upload_speed = 460800

lib_deps =
  lvgl/lvgl@^8.3.11
  lovyan03/LovyanGFX@^1.1.16

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D BATTERY_DIVIDER=6.0
  -I include
