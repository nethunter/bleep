[env:crowpanel_128]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

; BLE + LVGL + LovyanGFX together exceed the default app partition, so use the
; large single-app layout (no OTA).
board_build.partitions = huge_app.csv

lib_deps =
  lvgl/lvgl@^8.3.11
  lovyan03/LovyanGFX@^1.1.16
  h2zero/NimBLE-Arduino@^2.1.0
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.4.3

build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -D DISPLAY_RGB_ORDER=0
  -D DISPLAY_FLUSH_SWAP565=1
  -D DISPLAY_VARIANT_NAME=\"crowpanel-1.28\"
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_DRIVER_CANON_TRIGGER=1
  -D CONFIG_DRIVER_CANON_BLE=1
  -D CONFIG_DRIVER_TASCAM_X8=1
  -D CONFIG_DRIVER_HOME_ASSISTANT=1
  -D CONFIG_MAX_DEVICE_INSTANCES=12
  -D CONFIG_MAX_ACTIVE_LINKS=4
  -D CONFIG_MAX_ACTIVE_INSTANCES=8
  -D CONFIG_BLE_EVENT_QUEUE_SIZE=24
  -D CONFIG_BLE_ADV_PAYLOAD_SIZE=96
  -D CONFIG_BLE_MAX_SKIP_ADDRESSES=4

; Default build target: Montserrat UI font. The previous display-calibration
; variants (rgb/swap permutations) were collapsed into the defaults above once
; the correct GC9A01 color order was confirmed.

; Same firmware, but built with the embedded Roboto UI font instead of
; Montserrat. The unused family is gated off in lv_conf.h so each build only
; pays flash for the font it uses.
[env:crowpanel_128_roboto]
extends = env:crowpanel_128
build_flags =
  ${env:crowpanel_128.build_flags}
  -D UI_FONT_ROBOTO

[env:canon_ble]
extends = env:crowpanel_128
build_unflags =
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_DRIVER_TASCAM_X8=1
  -D CONFIG_DRIVER_CANON_TRIGGER=1
build_flags =
  ${env:crowpanel_128.build_flags}
  -D CONFIG_DRIVER_SHARK_NANO_II=0
  -D CONFIG_DRIVER_TASCAM_X8=0
  -D CONFIG_DRIVER_CANON_TRIGGER=0

[env:canon_trigger]
extends = env:crowpanel_128
build_unflags =
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_DRIVER_TASCAM_X8=1
  -D CONFIG_DRIVER_CANON_BLE=1
build_flags =
  ${env:crowpanel_128.build_flags}
  -D CONFIG_DRIVER_SHARK_NANO_II=0
  -D CONFIG_DRIVER_TASCAM_X8=0
  -D CONFIG_DRIVER_CANON_BLE=0

[env:tascam_x8]
extends = env:crowpanel_128
build_unflags =
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_DRIVER_CANON_BLE=1
  -D CONFIG_DRIVER_CANON_TRIGGER=1
build_flags =
  ${env:crowpanel_128.build_flags}
  -D CONFIG_DRIVER_SHARK_NANO_II=0
  -D CONFIG_DRIVER_CANON_BLE=0
  -D CONFIG_DRIVER_CANON_TRIGGER=0

[env:home_assistant]
extends = env:crowpanel_128
build_unflags =
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_DRIVER_CANON_BLE=1
  -D CONFIG_DRIVER_CANON_TRIGGER=1
  -D CONFIG_DRIVER_TASCAM_X8=1
build_flags =
  ${env:crowpanel_128.build_flags}
  -D CONFIG_DRIVER_SHARK_NANO_II=0
  -D CONFIG_DRIVER_CANON_BLE=0
  -D CONFIG_DRIVER_CANON_TRIGGER=0
  -D CONFIG_DRIVER_TASCAM_X8=0

[env:native]
platform = native
test_build_src = true
build_src_filter =
  +<devices/shark_nano_ii/protocol.cpp>
  +<devices/shark_nano_ii/state.cpp>
  +<devices/canon_ble/protocol.cpp>
  +<devices/canon_ble/state.cpp>
  +<devices/canon_trigger/protocol.cpp>
  +<devices/canon_trigger/state.cpp>
  +<devices/tascam_x8/protocol.cpp>
  +<devices/tascam_x8/state.cpp>
  +<core/driver_catalog.cpp>
  +<core/device_registry.cpp>
  +<core/config_store.cpp>
  +<core/home_assistant_config.cpp>
  +<core/device_manager.cpp>
  +<core/command_traits.cpp>
  +<core/scene_registry.cpp>
  +<core/scene_store.cpp>
  +<core/scene_runner.cpp>
  +<core/scene_service.cpp>
  +<core/ble/ble_types.cpp>
  +<core/ble/ble_central.cpp>
  +<core/ble/fake_ble_backend.cpp>
  +<devices/home_assistant/protocol.cpp>
build_flags =
  -std=gnu++17
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_DRIVER_CANON_TRIGGER=1
  -D CONFIG_DRIVER_CANON_BLE=1
  -D CONFIG_DRIVER_TASCAM_X8=1
  -D CONFIG_DRIVER_HOME_ASSISTANT=1
  -D CONFIG_MAX_DEVICE_INSTANCES=12
  -D CONFIG_MAX_ACTIVE_LINKS=4
  -D CONFIG_MAX_ACTIVE_INSTANCES=8
  -D CONFIG_MAX_SCENES=4
  -D CONFIG_MAX_SCENE_STEPS=8

; Desktop LVGL harness: renders the real UI into 240x240 PNG screenshots
; without flashing hardware. Run from the repo root:
;   PLATFORMIO_CORE_DIR="$PWD/.platformio-core" ./.venv/bin/platformio run -e ui_sim
;   .pio/build/ui_sim/program
[env:ui_sim]
platform = native
lib_deps =
  lvgl/lvgl@^8.3.11
build_src_filter =
  +<ui.cpp>
  +<scene_ui.cpp>
  +<portal_service.cpp>
  +<ui/recorder_shell.cpp>
  +<ui/picker_shell.cpp>
  +<devices/shark_nano_ii/ui.cpp>
  +<devices/shark_nano_ii/state.cpp>
  +<devices/shark_nano_ii/protocol.cpp>
  +<devices/canon_ble/ui.cpp>
  +<devices/canon_ble/state.cpp>
  +<devices/canon_ble/protocol.cpp>
  +<devices/canon_trigger/ui.cpp>
  +<devices/canon_trigger/state.cpp>
  +<devices/canon_trigger/protocol.cpp>
  +<devices/tascam_x8/ui.cpp>
  +<devices/tascam_x8/state.cpp>
  +<devices/tascam_x8/protocol.cpp>
  +<devices/home_assistant/ui.cpp>
  +<devices/home_assistant/driver.cpp>
  +<devices/home_assistant/client.cpp>
  +<devices/home_assistant/protocol.cpp>
  +<assets/ui_icons.c>
  +<core/driver_catalog.cpp>
  +<core/device_registry.cpp>
  +<core/config_store.cpp>
  +<core/home_assistant_config.cpp>
  +<core/device_manager.cpp>
  +<core/command_traits.cpp>
  +<core/scene_registry.cpp>
  +<core/scene_store.cpp>
  +<core/scene_runner.cpp>
  +<core/scene_service.cpp>
  +<../sim/main.cpp>
  +<../sim/millis.cpp>
  +<../sim/device_runtime_sim.cpp>
build_flags =
  -std=gnu++17
  -D UI_SIMULATOR=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_COLOR_16_SWAP=0
  -D LV_MEM_SIZE="(96U * 1024U)"
  -I include
  -I sim
  -I src
  -D CONFIG_DRIVER_SHARK_NANO_II=1
  -D CONFIG_DRIVER_CANON_TRIGGER=1
  -D CONFIG_DRIVER_CANON_BLE=1
  -D CONFIG_DRIVER_TASCAM_X8=1
  -D CONFIG_DRIVER_HOME_ASSISTANT=1
  -D CONFIG_MAX_DEVICE_INSTANCES=12
  -D CONFIG_MAX_ACTIVE_LINKS=4
  -D CONFIG_MAX_ACTIVE_INSTANCES=8
  -D CONFIG_MAX_SCENES=4
  -D CONFIG_MAX_SCENE_STEPS=8
