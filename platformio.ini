[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-211240
monitor_dtr = 0
monitor_rts = 0
upload_port = /dev/cu.usbserial-211240
upload_speed = 460800

lib_deps =
  lvgl/lvgl@^8.3.11
  lovyan03/LovyanGFX@^1.1.16

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D BATTERY_DIVIDER=6.0
  -I include

[env:crowpanel_128]
build_flags =
  ${env.build_flags}
  -D DISPLAY_RGB_ORDER=0
  -D DISPLAY_FLUSH_SWAP565=1
  -D DISPLAY_VARIANT_NAME=\"A:rgb0-swap565\"

[env:crowpanel_128_a_rgb0_swap565]
build_flags =
  ${env.build_flags}
  -D DISPLAY_RGB_ORDER=0
  -D DISPLAY_FLUSH_SWAP565=1
  -D DISPLAY_VARIANT_NAME=\"A:rgb0-swap565\"

[env:crowpanel_128_b_rgb1_swap565]
build_flags =
  ${env.build_flags}
  -D DISPLAY_RGB_ORDER=1
  -D DISPLAY_FLUSH_SWAP565=1
  -D DISPLAY_VARIANT_NAME=\"B:rgb1-swap565\"

[env:crowpanel_128_c_rgb0_lvswap_direct]
build_flags =
  ${env.build_flags}
  -D DISPLAY_RGB_ORDER=0
  -D DISPLAY_FLUSH_SWAP565=0
  -D LV_COLOR_16_SWAP=1
  -D DISPLAY_VARIANT_NAME=\"C:rgb0-lvswap-direct\"

[env:crowpanel_128_d_rgb1_lvswap_direct]
build_flags =
  ${env.build_flags}
  -D DISPLAY_RGB_ORDER=1
  -D DISPLAY_FLUSH_SWAP565=0
  -D LV_COLOR_16_SWAP=1
  -D DISPLAY_VARIANT_NAME=\"D:rgb1-lvswap-direct\"

[env:crowpanel_128_e_rgb1_swap565_gbfix]
build_flags =
  ${env.build_flags}
  -D DISPLAY_RGB_ORDER=1
  -D DISPLAY_FLUSH_SWAP565=1
  -D DISPLAY_REMAP_GB=1
  -D DISPLAY_VARIANT_NAME=\"E:rgb1-swap565-gbfix\"
