name: Device support request
description: Propose a new controlled device or controller hardware target
title: "[Device]: "
labels: [device-support]
body:
  - type: input
    id: product
    attributes:
      label: Exact product
      description: Manufacturer, model, revision, and required accessory.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Motion
        - Camera
        - Lighting
        - Audio recorder
        - Controller hardware
        - Other
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Desired controls and state
      description: What should Ble(e)p command, and what state can the device report?
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: Existing protocol information
      description: Link public documentation or code. Do not attach raw captures or secrets.
  - type: textarea
    id: hardware
    attributes:
      label: Hardware access
      description: Can you test on the physical device and report observed behavior?
